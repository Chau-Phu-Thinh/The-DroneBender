[project]
name = "the-dronebender"
version = "0.1.0"
description = "Control 3D Drone simulation and real drones using finger tracking and hand gestures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "mediapipe>=1.0.0",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10.0",
    "pyqt6>=6.11.0",
    "websockets>=14.0",
]
